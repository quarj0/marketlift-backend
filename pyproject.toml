[project]
name = "marketlift-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "channels[daphne]>=4.3,<5",
    "channels-redis>=4.3,<5",
    "python-dotenv>=1.0,<2",
    "djangorestframework>=3.16.0",
    "httpx>=0.28,<1",
    "celery[redis]>=5.5.0,<6",
    "redis>=6.0.0,<7",
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "strawberry-graphql-django>=0.87.0",
    "whitenoise>=6.12.0",
    "twisted[http2,tls]>=26.4.0",
    "dj-database-url>=3.1,<4",
    "django-anymail>=15.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
marketlift-backend = { workspace = true }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "marketlift-backend",
]
